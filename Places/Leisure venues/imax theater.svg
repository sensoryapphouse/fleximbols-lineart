  <!-- Building exterior shell -->
  <rect x="20" y="100" width="250" height="118" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Massive curved domed screen - the defining feature -->
  <!-- Dome outer shell -->
  <path d="M30,220 L30,120 Q145,10 260,120 L260,220 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Dome inner screen surface -->
  <path d="M45,220 L45,128 Q145,35 245,128 L245,220 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <!-- Screen projection glow - wide curved highlight -->
  <path d="M60,220 L60,140 Q145,58 230,140 L230,220 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Screen content lines suggesting projection -->
  <path d="M75,220 L75,155 Q145,82 215,155 L215,220 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Center bright projection zone -->
  <ellipse cx="145" cy="175" rx="55" ry="45" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <ellipse cx="145" cy="175" rx="40" ry="32" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Screen frame/edge accent -->
  <path d="M45,220 L45,128 Q145,35 245,128 L245,220" fill="none" stroke="#1a1a1a" stroke-width="3.33" stroke-linecap="round"/>
  <!-- Building base below dome -->
  <rect x="20" y="195" width="250" height="23" rx="0" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Entrance foyer protrusion -->
  <rect x="105" y="175" width="80" height="43" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Entrance doors -->
  <rect x="115" y="188" width="26" height="30" rx="3" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <rect x="149" y="188" width="26" height="30" rx="3" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Door windows -->
