<svg xmlns="http://www.w3.org/2000/svg" viewBox="83.39 92.78 345.21 345.21">
<!-- sentence = a row of word tokens ending with a full stop -->
<rect x="110" y="180" width="78" height="70" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="206" y="180" width="120" height="70" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="344" y="180" width="58" height="70" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="110" y="280" width="120" height="70" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<rect x="248" y="280" width="92" height="70" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- full stop ending the sentence -->
<circle cx="378" cy="332" r="20" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="9"/>
</svg>
