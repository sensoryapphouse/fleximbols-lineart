<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- FedEx Truck - white van with purple+orange colour-block band, back-to-front -->
  <!-- Shadow -->
  <ellipse cx="145" cy="208" rx="108" ry="7" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Main box body -->
  <rect x="30" y="108" width="170" height="82" rx="6" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Box roof -->
  <rect x="30" y="95" width="170" height="18" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Purple colour block upper band -->
  <rect x="30" y="108" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Clip top corners of band to match body rounding -->
  <rect x="30" y="130" width="170" height="10" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Orange colour block lower band -->
  <rect x="30" y="150" width="170" height="20" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Re-stroke body outline over bands -->
  <rect x="30" y="108" width="170" height="82" rx="6" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cab body -->
  <rect x="200" y="122" width="62" height="68" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cab roof -->
  <path d="M200 122 Q200 100 222 98 L248 98 Q262 98 262 122" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round" data-lp="hair"/>
  <!-- Windshield -->
  <path d="M222 100 L258 106 L258 124 L222 124 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Cab side window -->
  <rect x="204" y="126" width="24" height="20" rx="3" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Cab purple band continuation -->
  <rect x="200" y="122" width="62" height="22" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <rect x="200" y="136" width="62" height="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Cab orange band -->
  <rect x="200" y="150" width="62" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Re-stroke cab outline -->
  <rect x="200" y="122" width="62" height="68" rx="8" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Rear bumper -->
  <rect x="30" y="182" width="12" height="8" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Front bumper -->
  <rect x="250" y="182" width="12" height="8" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>
  <!-- Front wheel -->
  <circle cx="228" cy="192" r="20" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="228" cy="192" r="9" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.55"/>
  <!-- Rear wheel -->
  <circle cx="66" cy="192" r="20" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <circle cx="66" cy="192" r="9" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.55"/>
</g></svg>