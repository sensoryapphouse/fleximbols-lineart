<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,44.186) scale(0.9137)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Patchwork quilted blanket - laid flat with visible stitch lines -->
  <!-- Outer border -->
  <rect x="25" y="30" width="240" height="180" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="7.11" stroke-linejoin="round"/>

  <!-- Inner quilt face: 5 cols x 4 rows of patches -->
  <!-- Row 1 -->
  <rect x="35" y="40" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="79" y="40" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="123" y="40" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="167" y="40" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="211" y="40" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 2 -->
  <rect x="35" y="80" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="79" y="80" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="123" y="80" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="167" y="80" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="211" y="80" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 3 -->
  <rect x="35" y="120" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="79" y="120" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="123" y="120" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="167" y="120" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="211" y="120" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Row 4 -->
  <rect x="35" y="160" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="79" y="160" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="123" y="160" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="167" y="160" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="211" y="160" width="44" height="40" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Diagonal quilting stitch lines (dashed) across each patch -->
  <g stroke="#1a1a1a" stroke-width="2.13" stroke-dasharray="3 3" fill="none" stroke-linecap="round">
    <line x1="35" y1="80" x2="255" y2="80"/>
    <line x1="35" y1="120" x2="255" y2="120"/>
    <line x1="35" y1="160" x2="255" y2="160"/>
    <line x1="79" y1="40" x2="79" y2="200"/>
    <line x1="123" y1="40" x2="123" y2="200"/>
    <line x1="167" y1="40" x2="167" y2="200"/>
    <line x1="211" y1="40" x2="211" y2="200"/>
  </g>

  <!-- Cross-stitch decorative motifs in alternating patches -->
  <g stroke="#1a1a1a" stroke-width="3.20" fill="none" stroke-linecap="round">
    <path d="M 52 55 l 10 10 M 62 55 l -10 10"/>
    <path d="M 140 55 l 10 10 M 150 55 l -10 10"/>
    <path d="M 228 55 l 10 10 M 238 55 l -10 10"/>
    <path d="M 96 95 l 10 10 M 106 95 l -10 10"/>
    <path d="M 184 95 l 10 10 M 194 95 l -10 10"/>
    <path d="M 52 135 l 10 10 M 62 135 l -10 10"/>
    <path d="M 140 135 l 10 10 M 150 135 l -10 10"/>
    <path d="M 228 135 l 10 10 M 238 135 l -10 10"/>
    <path d="M 96 175 l 10 10 M 106 175 l -10 10"/>
    <path d="M 184 175 l 10 10 M 194 175 l -10 10"/>
  </g>

  <!-- Slight fold corner peeling up at bottom-right -->
  <path d="M 230 200 L 265 210 L 255 220 L 220 210 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.33" stroke-linejoin="round"/>
</g></g><g transform="translate(360 8) scale(0.2812)"><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>