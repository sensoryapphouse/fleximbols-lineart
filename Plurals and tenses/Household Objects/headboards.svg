<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- headboard: upholstered curved-top bed headboard with diamond tufting and legs -->
<!-- board -->
<path d="M110 360 L110 220 Q110 150 256 150 Q402 150 402 220 L402 360 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- diamond quilting lines -->
<g stroke="#1a1a1a" stroke-width="5">
<line x1="160" y1="200" x2="220" y2="260"/>
<line x1="220" y1="200" x2="280" y2="260"/>
<line x1="280" y1="200" x2="340" y2="260"/>
<line x1="340" y1="200" x2="380" y2="240"/>
<line x1="220" y1="200" x2="160" y2="260"/>
<line x1="280" y1="200" x2="220" y2="260"/>
<line x1="340" y1="200" x2="280" y2="260"/>
<line x1="160" y1="270" x2="220" y2="330"/>
<line x1="220" y1="270" x2="280" y2="330"/>
<line x1="280" y1="270" x2="340" y2="330"/>
<line x1="220" y1="270" x2="160" y2="330"/>
<line x1="280" y1="270" x2="220" y2="330"/>
<line x1="340" y1="270" x2="280" y2="330"/>
</g>
<!-- tufting buttons -->
<g fill="#1a1a1a">
<circle cx="220" cy="260" r="4"/><circle cx="280" cy="260" r="4"/><circle cx="340" cy="260" r="4"/>
<circle cx="160" cy="260" r="4"/>
<circle cx="220" cy="330" r="4"/><circle cx="280" cy="330" r="4"/>
</g>
<!-- legs -->
<rect x="140" y="360" width="22" height="56" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9"/>
<rect x="350" y="360" width="22" height="56" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9"/>
<g transform="translate(360 8) scale(0.2812)"><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
