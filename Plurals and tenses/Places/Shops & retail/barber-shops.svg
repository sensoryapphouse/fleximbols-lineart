  <rect x="73" y="124" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <rect x="73" y="152" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <rect x="73" y="180" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <!-- Blue stripe -->
  <rect x="73" y="110" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <rect x="73" y="138" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
  <rect x="73" y="166" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.42" />
