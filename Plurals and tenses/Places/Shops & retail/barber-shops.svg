  <!-- Building facade -->
  <rect x="55" y="100" width="200" height="120" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round" data-lp="hair"/>
  <!-- Roof flat parapet -->
