  <ellipse cx="87" cy="218" rx="14" ry="7" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- BARBER CHAIR (visible through window area) -->
  <!-- Seat -->
  <rect x="110" y="160" width="30" height="12" rx="2" ry="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Back -->
  <rect x="110" y="136" width="10" height="26" rx="2" ry="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="3.70"/>
  <!-- Headrest -->
  <rect x="110" y="132" width="10" height="7" rx="2" ry="2" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.96"/>
