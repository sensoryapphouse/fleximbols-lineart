  <rect x="48" y="148" width="64" height="38" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.55" stroke-linejoin="round"/>

  <!-- Bell shape -->
  <!-- Bell body -->
  <path d="M 80 60 Q 45 78 42 118 Q 42 130 80 135 Q 118 130 118 118 Q 115 78 80 60 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
