  <!-- IPO: bell on podium + big rocketing chart (stock exchange opening bell) -->

  <!-- Podium base -->
  <rect x="30" y="185" width="100" height="30" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
