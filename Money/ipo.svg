  <circle cx="80" cy="140" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Bell cap/ring at top -->
  <rect x="74" y="50" width="12" height="16" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
  <!-- Ringing motion lines -->
