  <path d="M 122 90 Q 132 78 128 62" fill="none" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

  <!-- Big chart (right half) -->
  <!-- Chart axes -->
  <line x1="155" y1="210" x2="155" y2="40" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>
  <line x1="155" y1="210" x2="265" y2="210" stroke="#1a1a1a" stroke-width="4.45" stroke-linecap="round"/>

