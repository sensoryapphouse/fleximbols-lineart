<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.91 81.42 378.18 378.18">
<!-- gift / party loot bag with handles and treats poking out -->
<!-- bag body -->
<path d="M 150 200 L 362 200 L 348 432 L 164 432 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
<!-- folded top rim -->
<rect x="142" y="180" width="228" height="34" rx="6" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9"/>
<!-- handles -->
<path d="M 196 182 Q 196 110 240 110 Q 256 110 256 130" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<path d="M 316 182 Q 316 110 272 110 Q 256 110 256 130" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
<!-- polka dots on bag -->
<circle cx="206" cy="270" r="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<circle cx="266" cy="300" r="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<circle cx="320" cy="262" r="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<circle cx="210" cy="360" r="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<circle cx="300" cy="360" r="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<!-- treats poking out of the top: a lollipop and tissue puff -->
<circle cx="200" cy="150" r="24" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="8"/>
<line x1="200" y1="174" x2="200" y2="196" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
<path d="M 300 168 Q 286 132 312 128 Q 300 150 332 146 Q 318 176 300 168 Z" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
</svg>
