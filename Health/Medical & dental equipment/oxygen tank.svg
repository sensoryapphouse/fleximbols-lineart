<svg xmlns="http://www.w3.org/2000/svg" viewBox="91.23 79.28 356.85 356.85"><g>
<!-- oxygen tank: cylinder with domed top shoulder, valve + handwheel -->

<!-- cylinder body with a DOMED top shoulder (path, not a plain rect) -->
<path d="M 196 236
         Q 196 176 256 168
         Q 316 176 316 236
         L 316 356
         Q 316 410 256 410
         Q 196 410 196 356
         Z"
      fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

<!-- white label band with medical cross (no text) -->
<rect x="196" y="270" width="120" height="92" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="6"/>
<!-- medical cross on label -->
<rect x="244" y="290" width="24" height="56" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />
<rect x="228" y="306" width="56" height="24" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="5.00" />

<!-- neck (sits on the domed shoulder) -->
<rect x="238" y="132" width="36" height="46" rx="4" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9"/>
<!-- valve / regulator -->
<rect x="216" y="104" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="9"/>
<!-- handwheel -->
<circle cx="320" cy="124" r="22" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="9"/>
</g></svg>
